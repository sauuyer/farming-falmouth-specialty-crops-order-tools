<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Management — Farming Falmouth Specialty Crops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="public/favicon.ico">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand">
      <picture>
        <source srcset="assets/logo.svg" type="image/svg+xml">
        <img src="assets/logo.png" alt="" class="logo" onerror="this.style.display='none'">
      </picture>
      <div><h1>Farming Falmouth Specialty Crops</h1><p class="page-sub">Order Management (backend view)</p></div>
    </div>
    <div class="dates">
      <div class="date"><span class="lab">Delivery week</span><b id="dWeek">&mdash;</b></div>
      <div class="date flag"><span class="lab" id="labOrder">Order by</span><b id="dOrder">&mdash;</b></div>
      <div class="date"><span class="lab" id="labDeliver">Pick up or delivery</span><b id="dDeliver">&mdash;</b></div>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="settings" aria-selected="true">This week's offerings</button>
    <button role="tab" data-tab="form" aria-selected="false">Order form preview</button>
    <button role="tab" data-tab="summary" aria-selected="false">Weekly summary</button>
    <button role="tab" data-tab="orders" aria-selected="false">Orders</button>
  </nav>
</header>
<main id="view"><div class="empty">Loading&hellip;</div></main>
<script>const MODE = "admin";</script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
